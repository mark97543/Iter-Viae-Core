<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mensa — Tactical Map Surface</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div id="map"></div>
    <div id="debug-overlay">
      <span class="debug-label">ZOOM</span>
      <span id="zoom-val">4.00</span>
    </div>

    <!-- POI Data Panel -->
    <aside id="poi-panel" aria-label="Point of interest details" aria-hidden="true">
      <div id="poi-panel-header">
        <div id="poi-panel-header-left">
          <span id="poi-category-badge"></span>
          <p id="poi-panel-name"></p>
        </div>
        <div style="display: flex; gap: 8px;">
          <button id="poi-add-to-trip" title="Add to Trip">+</button>
          <button id="poi-panel-close" aria-label="Close POI panel">&times;</button>
        </div>
      </div>
      <div id="poi-panel-body"></div>
      <div id="poi-panel-coords">
        <span id="poi-coord-lat"></span>
        <span>&nbsp;&middot;&nbsp;</span>
        <span id="poi-coord-lng"></span>
      </div>
    </aside>

    <!-- Trip Itinerary Panel -->
    <aside id="trip-panel" aria-label="Trip Itinerary" aria-hidden="false" class="open">
      <div id="trip-panel-header">
        <input type="text" id="trip-title" value="My Tactical Operation" />
        <input type="text" id="trip-start-time" title="Trip Start Time" style="margin-top: 10px; width: 100%; padding: 6px; background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(51, 65, 85, 0.8); border-radius: 4px; color: #38bdf8; font-family: monospace; font-size: 0.85rem;" placeholder="Select Start Time..." />
      </div>
      <div id="trip-panel-body">
        <ul id="trip-waypoint-list">
          <!-- Waypoints injected here -->
        </ul>
      </div>
      <div id="trip-panel-footer">
        <div class="trip-metric">
          <span class="trip-metric-label">DISTANCE</span>
          <span id="trip-dist-val">0 mi</span>
        </div>
        <div class="trip-metric">
          <span class="trip-metric-label">DRIVE TIME</span>
          <span id="trip-time-val">0 hrs</span>
        </div>
        <div class="trip-metric">
          <span class="trip-metric-label">BUDGET</span>
          <span id="trip-budget-val">$0</span>
        </div>
      </div>
    </aside>

    <!-- Map Context Menu -->
    <div id="map-context-menu" class="hidden">
      <button id="ctx-add-wp">Add Waypoint Here</button>
    </div>

    <!-- Waypoint Editor Modal -->
    <div id="waypoint-modal" class="modal-overlay" style="display: none;">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="modal-wp-title">Edit Waypoint</h3>
          <button id="modal-close-btn" class="modal-close">&times;</button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="modal-wp-id" />
          
          <label class="modal-label">Waypoint Name</label>
          <input type="text" id="modal-wp-name" class="modal-input" />
          
          <label class="modal-label">Schedule</label>
          <div class="modal-radio-group">
            <label><input type="radio" name="modal-schedule-type" value="stop" checked /> Stop</label>
            <label><input type="radio" name="modal-schedule-type" value="overnight" /> Overnight</label>
          </div>
          
          <div id="modal-stop-fields" class="modal-conditional-field">
            <label class="modal-label">Stay Duration (Minutes)</label>
            <input type="number" id="modal-wp-stay" class="modal-input" min="0" value="0" />
          </div>
          
          <div id="modal-overnight-fields" class="modal-conditional-field" style="display: none;">
            <label class="modal-label">Next Day Departure Time</label>
            <input type="text" id="modal-wp-depart" class="modal-input" value="08:00" placeholder="Select Time..." />
          </div>
          
          <label class="modal-label">Budget ($)</label>
          <input type="number" id="modal-wp-budget" class="modal-input" min="0" step="0.01" value="0" />
          
          <label class="modal-label">Notes</label>
          <textarea id="modal-wp-notes" class="modal-input" rows="3" placeholder="Enter tactical notes..."></textarea>
        </div>
        <div class="modal-footer">
          <button id="modal-save-btn" class="btn-primary">Save Changes</button>
        </div>
      </div>
    </div>
  </body>
</html>
