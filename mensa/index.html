<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mensa — Tactical Map Surface</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div id="map"></div>
    <div id="debug-overlay">
      <span class="debug-label">ZOOM</span>
      <span id="zoom-val">4.00</span>
    </div>

    <!-- POI Data Panel -->
    <aside id="poi-panel" aria-label="Point of interest details" aria-hidden="true">
      <div id="poi-panel-header">
        <div id="poi-panel-header-left">
          <span id="poi-category-badge"></span>
          <p id="poi-panel-name"></p>
        </div>
        <div style="display: flex; gap: 8px;">
          <button id="poi-add-to-trip" title="Add to Trip">+</button>
          <button id="poi-panel-close" aria-label="Close POI panel">&times;</button>
        </div>
      </div>
      <div id="poi-panel-body"></div>
      <div id="poi-panel-coords">
        <span id="poi-coord-lat"></span>
        <span>&nbsp;&middot;&nbsp;</span>
        <span id="poi-coord-lng"></span>
      </div>
    </aside>

    <!-- Trip Itinerary Panel -->
    <aside id="trip-panel" aria-label="Trip Itinerary" aria-hidden="false" class="open">
      <div id="trip-panel-header">
        <h2 id="trip-title-display" title="Click to view Trip Summary">My Tactical Operation</h2>
      </div>
      <div id="trip-panel-body">
        <ul id="trip-waypoint-list">
          <!-- Waypoints injected here -->
        </ul>
      </div>
      <div id="trip-panel-footer">
        <div class="trip-metric">
          <span class="trip-metric-label">DISTANCE</span>
          <span id="trip-dist-val">0 mi</span>
        </div>
        <div class="trip-metric">
          <span class="trip-metric-label">DRIVE TIME</span>
          <span id="trip-time-val">0 hrs</span>
        </div>
        <div class="trip-metric">
          <span class="trip-metric-label">BUDGET</span>
          <span id="trip-budget-val">$0</span>
        </div>
      </div>
    </aside>

    <!-- Map Context Menu -->
    <div id="map-context-menu" class="hidden">
      <button id="ctx-add-wp">Add Waypoint Here</button>
    </div>

    <!-- Waypoint Editor Modal -->
    <div id="waypoint-modal" class="modal-overlay" style="display: none;">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="modal-wp-title">Edit Waypoint</h3>
          <button id="modal-close-btn" class="modal-close">&times;</button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="modal-wp-id" />
          
          <label class="modal-label">Waypoint Name</label>
          <input type="text" id="modal-wp-name" class="modal-input" />
          
          <label class="modal-label">Stop Type</label>
          <select id="modal-wp-type" class="modal-input">
            <option value="Waypoint">Waypoint</option>
            <option value="Start">Start</option>
            <option value="End">End</option>
            <option value="Shaping">Shaping (Pass-Through)</option>
            <option value="Gas">Gas</option>
            <option value="Food">Food</option>
            <option value="Attraction">Attraction</option>
            <option value="Lodging">Lodging</option>
          </select>
          
          <label class="modal-label">Schedule</label>
          <div class="modal-radio-group">
            <label><input type="radio" name="modal-schedule-type" value="stop" checked /> Stop</label>
            <label><input type="radio" name="modal-schedule-type" value="overnight" /> Overnight</label>
          </div>
          
          <div id="modal-stop-fields" class="modal-conditional-field">
            <label class="modal-label">Stay Duration (Minutes)</label>
            <input type="number" id="modal-wp-stay" class="modal-input" min="0" value="0" />
          </div>
          
          <div id="modal-overnight-fields" class="modal-conditional-field" style="display: none;">
            <label class="modal-label">Next Day Departure Time</label>
            <input type="text" id="modal-wp-depart" class="modal-input" value="08:00" placeholder="Select Time..." />
          </div>
          
          <label class="modal-label">Budget ($)</label>
          <input type="number" id="modal-wp-budget" class="modal-input" min="0" step="0.01" value="0" />
          
          <label class="modal-label">Notes</label>
          <textarea id="modal-wp-notes" class="modal-input" rows="3" placeholder="Enter tactical notes..."></textarea>
        </div>
        <div class="modal-footer">
          <button id="modal-save-btn" class="btn-primary">Save Changes</button>
        </div>
      </div>
    </div>
    <!-- Trip Summary Modal -->
    <div id="trip-summary-modal" class="modal-overlay" style="display: none;">
      <div class="modal-content" style="width: 500px;">
        <div class="modal-header">
          <h3>Trip Summary & Settings</h3>
          <button id="summary-close-btn" class="modal-close">&times;</button>
        </div>
        <div class="modal-body">
          <label class="modal-label">Operation Title</label>
          <input type="text" id="summary-trip-title" class="modal-input" value="My Tactical Operation" />
          
          <label class="modal-label" style="display: flex; align-items: center; gap: 8px; margin-top: 8px;">
            <input type="checkbox" id="summary-has-date" checked />
            Plan with Specific Calendar Dates
          </label>
          
          <div id="summary-date-fields" class="modal-conditional-field">
            <label class="modal-label">Start Date & Time</label>
            <input type="text" id="summary-start-time" class="modal-input" placeholder="Select Start Time..." />
          </div>
          
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; background: rgba(15, 23, 42, 0.5); padding: 12px; border-radius: 4px; border: 1px solid rgba(51, 65, 85, 0.8);">
            <div>
              <div class="modal-label">Total Waypoints</div>
              <div id="summary-tot-wp" style="color: #38bdf8; font-weight: bold;">0</div>
            </div>
            <div>
              <div class="modal-label">Total Distance</div>
              <div id="summary-tot-dist" style="color: #38bdf8; font-weight: bold;">0 mi</div>
            </div>
            <div>
              <div class="modal-label">Total Drive Time</div>
              <div id="summary-tot-time" style="color: #38bdf8; font-weight: bold;">0 hrs</div>
            </div>
            <div>
              <div class="modal-label">Total Budget</div>
              <div id="summary-tot-budget" style="color: #38bdf8; font-weight: bold;">$0</div>
            </div>
            <div style="grid-column: span 2;">
              <div class="modal-label">Estimated Completion</div>
              <div id="summary-est-end" style="color: #34d399; font-weight: bold; font-family: monospace;">--</div>
            </div>
          </div>
          
          <label class="modal-label" style="margin-top: 8px;">Overall Mission Notes</label>
          <textarea id="summary-trip-notes" class="modal-input" rows="4" placeholder="Enter high-level tactical notes or briefings..."></textarea>
        </div>
        <div class="modal-footer">
          <button id="summary-save-btn" class="btn-primary">Save & Apply</button>
        </div>
      </div>
    </div>
  </body>
</html>
