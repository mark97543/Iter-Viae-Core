<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%">
  <defs>
    <linearGradient id="roadGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#303030" />
      <stop offset="100%" stop-color="#1c1c1c" />
    </linearGradient>
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5A5A" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
  </defs>

  <rect width="800" height="300" rx="16" fill="#303030" />
  
  <rect x="10" y="10" width="780" height="280" rx="12" fill="#121212" stroke="#444444" stroke-width="1" stroke-dasharray="4" />

  <g id="emblem-graphic" transform="translate(20, 0)">
    <polygon points="120,60 50,240 190,240" fill="url(#roadGrad)" stroke="#444444" stroke-width="2" />
    
    <line x1="120" y1="240" x2="120" y2="70" stroke="#F8F9FF" stroke-width="3" stroke-dasharray="14,10" opacity="0.8" />
    
    <circle cx="120" cy="150" r="75" fill="none" stroke="#444444" stroke-width="2" />
    <circle cx="120" cy="150" r="85" fill="none" stroke="#EF4444" stroke-width="1" stroke-dasharray="2,6" />
    
    <line x1="120" y1="50" x2="120" y2="60" stroke="#EF4444" stroke-width="3" />
    <line x1="120" y1="240" x2="120" y2="250" stroke="#444444" stroke-width="3" />
    <line x1="35" y1="150" x2="45" y2="150" stroke="#444444" stroke-width="3" />
    <line x1="195" y1="150" x2="205" y2="150" stroke="#444444" stroke-width="3" />

    <polygon points="120,80 85,175 120,155 155,175" fill="url(#crimsonGrad)" filter="drop-shadow(0px 4px 8px rgba(0,0,0,0.5))" />
  </g>

  <text x="260" y="155" font-family="'Roboto Condensed', 'Arial Black', sans-serif" font-size="64" font-weight="900" fill="#F8F9FF" letter-spacing="4">ITER VIAE</text>
  
  <text x="265" y="205" font-family="'Roboto Condensed', sans-serif" font-size="18" font-weight="700" fill="#EF4444" letter-spacing="8">WAY OF THE ROAD</text>
</svg>
