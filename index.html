<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ITER VIAE — Tactical Travel & Expedition Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app">
      <!-- Header Banner -->
      <header class="main-header">
        <div class="header-container">
          <div class="brand-group">
            <span class="brand-logo">🧭</span>
            <div class="brand-titles">
              <h1 class="brand-name">ITER VIAE</h1>
              <span class="brand-sub">TACTICAL TRAVEL & EXPEDITION PLATFORM</span>
            </div>
          </div>
          <div class="header-actions">
            <button id="btn-header-auth" class="btn btn-outline">
              <span class="btn-icon">🔑</span>
              <span id="header-auth-label">SIGN IN</span>
            </button>
          </div>
        </div>
      </header>

      <!-- Main Workspace Container (Blank Slate) -->
      <main class="main-content" id="main-content">
        <!-- Clean canvas ready for building homepage features -->
      </main>

      <!-- PocketBase Auth Modal -->
      <div class="modal-overlay" id="auth-modal" style="display: none;">
        <div class="modal-card auth-modal-card">
          <div class="modal-header">
            <div>
              <h2 class="modal-title" id="auth-modal-title">ITER VIAE ACCOUNT AUTH</h2>
              <p class="modal-subtitle" id="auth-modal-subtitle">Sign in to access your saved expedition routes</p>
            </div>
            <button class="btn-icon-close" id="auth-modal-close">&times;</button>
          </div>
          <div class="modal-body">
            <form id="login-form">
              <div class="form-group" id="auth-name-group" style="display: none;">
                <label>FULL NAME / RIDER NAME</label>
                <input type="text" id="auth-name" placeholder="Mark Wade" />
              </div>

              <div class="form-group">
                <label>EMAIL OR USERNAME</label>
                <input type="text" id="auth-email" required placeholder="user@wade-usa.com" />
              </div>

              <div class="form-group">
                <label>PASSWORD</label>
                <input type="password" id="auth-password" required placeholder="••••••••" />
              </div>

              <div class="form-group" id="auth-vehicle-group" style="display: none;">
                <label>PRIMARY EXPEDITION VEHICLE</label>
                <select id="auth-vehicle" class="form-select">
                  <option value="motorcycle">🏍️ Motorcycle / Dual-Sport</option>
                  <option value="overland">🚙 4x4 / Overland Rig</option>
                  <option value="car">🚗 Road Trip Car</option>
                  <option value="bicycle">🚲 Bicycle / Bikepacking</option>
                  <option value="hiking">🥾 Hiking / Foot Expedition</option>
                </select>
              </div>

              <div id="auth-error-msg" class="auth-error" style="display: none;"></div>
              <button type="submit" id="btn-submit-auth" class="btn btn-primary btn-full">
                🚀 Sign In to Iter Viae
              </button>
              <div class="form-toggle-row">
                <button type="button" id="btn-toggle-auth-mode">
                  Need an account? Create one here
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!-- User Dashboard Modal -->
      <div class="modal-overlay" id="dashboard-modal" style="display: none;">
        <div class="modal-card dashboard-modal-card">
          <div class="modal-header">
            <div>
              <h2 class="modal-title">👤 EXPEDITION PROFILE</h2>
              <p class="modal-subtitle" id="dash-user-email">Logged in as rider</p>
            </div>
            <button class="btn-icon-close" id="dash-modal-close">&times;</button>
          </div>
          <div class="modal-body">
            <div class="dashboard-user-box">
              <div class="user-avatar-badge">🏍️</div>
              <div class="user-info-text">
                <h3 id="dash-user-name">RIDER ACCOUNT</h3>
                <span class="user-status-tag">ACTIVE CLOUD SESSION</span>
              </div>
            </div>

            <div class="dashboard-section-title">YOUR EXPEDITION ROUTES</div>
            <div id="user-trips-list" class="user-trips-list">
              <div class="empty-trips-msg">No saved trips found. Create a route to sync to mobile cockpit.</div>
            </div>

            <button id="btn-user-logout" class="btn btn-danger btn-full" style="margin-top: 16px;">
              🚪 Sign Out of Account
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Notification Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
