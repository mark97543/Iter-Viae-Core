<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Multi-Trip Engine — Direct Trip Routing & Field Manuals</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="travel-app-body">

    <!-- Top HUD Header Banner -->
    <header class="hud-banner">
      <div class="dash-app-branding" id="header-brand-link" title="Travel Book Dashboard">
        <span class="dash-app-logo">✈️</span>
        <div class="dash-app-titles">
          <h1 class="dash-app-name">FAMILY TRAVEL BOOK</h1>
          <span class="dash-app-sub">travel.wade-usa.com</span>
        </div>
      </div>
    </header>

    <!-- Main Container -->
    <main class="app-main-container">

      <!-- ==================================================================== -->
      <!-- VIEW 1: DASHBOARD (#/)                                               -->
      <!-- ==================================================================== -->
      <section id="dashboard-view" class="view-section">

        <!-- Filter / Search Controls Bar -->
        <div class="library-toolbar">
          <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="trip-search-input" placeholder="Search trips by slug, destination, or title..." />
          </div>
          <div class="filter-status-group">
            <button class="filter-btn active" data-status="all">ALL TRIPS</button>
            <button class="filter-btn" data-status="active">🟢 ACTIVE</button>
            <button class="filter-btn" data-status="upcoming">🔵 UPCOMING</button>
            <button class="filter-btn" data-status="archive">🟠 ARCHIVE</button>
          </div>
        </div>

        <!-- Trip Slug Cards Grid -->
        <div class="slug-cards-grid" id="slug-cards-grid">
          <!-- Dynamically populated via main.ts -->
        </div>
      </section>

      <!-- ==================================================================== -->
      <!-- VIEW 2: DIRECT TRIP PAGE FIELD MANUAL VIEW (#/trips/:slug)           -->
      <!-- ==================================================================== -->
      <section id="trip-detail-view" class="view-section" style="display: none;">
        <!-- Navigation Back & Quick Direct Link Bar -->
        <div class="detail-nav-bar">
          <button id="btn-back-to-dashboard" class="btn-back">
            &larr; Back to Master Dashboard
          </button>
          <button id="btn-open-add-section-modal" class="btn-add-section">
            ➕ Add Topic Section
          </button>
        </div>

        <!-- Dynamic Slug Header Container -->
        <div id="trip-header-container">
          <!-- Populated by main.ts -->
        </div>

        <!-- 2-Column Field Book Layout (Left Sidebar TOC + Main Content Column) -->
        <div class="field-book-layout">
          <!-- Left Sidebar Table of Contents -->
          <aside id="sticky-toc-bar" class="sticky-toc-sidebar">
            <!-- Populated dynamically by main.ts -->
          </aside>

          <!-- Main Content Column -->
          <div class="field-book-main-col">
            <!-- Field Manual Continuous Book Sections -->
            <div id="field-manual-sections-container" class="field-manual-sections-container">
              <!-- Populated dynamically by main.ts -->
            </div>
          </div>
        </div>
      </section>

    </main>

    <!-- Add / Edit Topic Section Modal -->
    <div id="section-modal" class="modal-backdrop" style="display: none;">
      <div class="modal-card">
        <div class="modal-header">
          <h2 class="modal-title" id="section-modal-title">➕ Add New Topic Section</h2>
          <button id="section-modal-close" class="modal-close-btn">&times;</button>
        </div>
        <form id="section-form" class="modal-form">
          <input type="hidden" id="section-edit-index" value="-1" />
          <div class="form-group">
            <label for="section-title-input">Topic Section Title</label>
            <input type="text" id="section-title-input" required placeholder="e.g., Flight Operations, Emergency Contacts, Food Guide..." />
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="section-icon-input">Icon / Emoji</label>
              <input type="text" id="section-icon-input" placeholder="e.g., ✈️, 🏨, 🍜, 💡" value="💡" />
            </div>
            <div class="form-group">
              <label for="section-slug-input">Topic Slug (Optional)</label>
              <input type="text" id="section-slug-input" placeholder="auto-generated-slug" />
            </div>
          </div>
          <div class="form-group">
            <label>Topic Writeup & Rich Content (TipTap WYSIWYG Editor)</label>
            <div class="tiptap-editor-wrapper">
              <!-- TipTap Toolbar -->
              <div id="tiptap-toolbar" class="tiptap-toolbar">
                <button type="button" class="tiptap-btn" data-action="bold" title="Bold"><b>B</b></button>
                <button type="button" class="tiptap-btn" data-action="italic" title="Italic"><i>I</i></button>
                <button type="button" class="tiptap-btn" data-action="strike" title="Strikethrough"><s>S</s></button>
                <button type="button" class="tiptap-btn" data-action="code" title="Inline Code"><code>&lt;/&gt;</code></button>
                <span class="toolbar-separator"></span>
                <button type="button" class="tiptap-btn" data-action="heading-1" title="Heading 1">H1</button>
                <button type="button" class="tiptap-btn" data-action="heading-2" title="Heading 2">H2</button>
                <button type="button" class="tiptap-btn" data-action="heading-3" title="Heading 3">H3</button>
                <button type="button" class="tiptap-btn" data-action="paragraph" title="Paragraph">P</button>
                <span class="toolbar-separator"></span>
                <button type="button" class="tiptap-btn" data-action="bullet-list" title="Bullet List">• List</button>
                <button type="button" class="tiptap-btn" data-action="ordered-list" title="Numbered List">1. List</button>
                <button type="button" class="tiptap-btn" data-action="blockquote" title="Quote Block">“” Quote</button>
                <button type="button" class="tiptap-btn" data-action="hr" title="Horizontal Divider">― Line</button>
                <span class="toolbar-separator"></span>
                <!-- Presets & Insertion Helpers -->
                <button type="button" class="tiptap-btn preset-btn" data-action="insert-callout" title="Insert Field Callout Box">📌 Callout</button>
                <button type="button" class="tiptap-btn preset-btn" data-action="insert-table" title="Insert Rosetta Table">📊 Table</button>
                <button type="button" class="tiptap-btn preset-btn" data-action="insert-flashcards" title="Insert Emergency Flashcards">🎴 Cards</button>
                <span class="toolbar-separator"></span>
                <button type="button" class="tiptap-btn" data-action="undo" title="Undo">↩️</button>
                <button type="button" class="tiptap-btn" data-action="redo" title="Redo">↪️</button>
              </div>
              <!-- TipTap Editor Content editable Surface -->
              <div id="tiptap-editor-element" class="tiptap-editor-element"></div>
            </div>
          </div>
          <div class="modal-actions">
            <button type="button" id="section-modal-cancel" class="btn-secondary">Cancel</button>
            <button type="submit" class="btn-primary">💾 Save Topic Section</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container" class="toast-container"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
