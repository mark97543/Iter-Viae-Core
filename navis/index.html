<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#090d16" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Navis — Mobile Tactical Navigator</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div id="app-viewport">
      <!-- Top Header & Search Bar -->
      <header id="navis-header">
        <div class="search-container">
          <input type="text" id="coord-search-input" placeholder="Search Lat, Lng coordinates..." />
          <button id="coord-search-btn">GO</button>
        </div>
        <div class="header-controls">
          <button id="btn-recenter" class="icon-btn" title="Recenter GPS">🎯</button>
          <button id="btn-load-trip" class="icon-btn" title="Load Trip File">📂</button>
          <button id="btn-voice-toggle" class="icon-btn active" title="Toggle Voice Prompts">🔊</button>
        </div>
      </header>

      <!-- Map Container -->
      <main id="map-container">
        <div id="map"></div>
      </main>

      <!-- Bottom Navigation Footer -->
      <footer id="navis-footer">
        <div id="nav-banner">
          <div id="nav-maneuver-icon">⬆</div>
          <div id="nav-details">
            <span id="nav-street-name">Navis Standby</span>
            <span id="nav-sub-info">Load a trip or search coordinates to begin navigation</span>
          </div>
        </div>
      </footer>
    </div>

    <!-- Hidden File Input for Trip Loading Fallback -->
    <input type="file" id="trip-file-input" accept="*/*" style="display: none;" />

    <!-- Mobile Trip Selection Modal -->
    <div id="trip-modal" class="modal-overlay hidden">
      <div class="modal-card">
        <div class="modal-header">
          <h3>📂 Load Tactical Trip Operation</h3>
          <button id="modal-close-btn" class="icon-close-btn">&times;</button>
        </div>
        <div class="modal-body">
          <p class="modal-description">Select any .viae, .vaie, .json, or .geojson trip file from phone storage or load demo route.</p>
          
          <div class="modal-action-group">
            <label for="modal-visible-file-input" class="modal-btn primary-btn">
              📁 Choose File from Phone...
            </label>
            <input type="file" id="modal-visible-file-input" accept="*/*" />

            <button id="btn-load-demo-trip" class="modal-btn secondary-btn">
              ⚡ Load Demo Tactical Route
            </button>
          </div>

          <div class="modal-divider"><span>OR PASTE TRIP JSON</span></div>

          <textarea id="trip-paste-input" placeholder="Paste .viae or .json trip content here..."></textarea>
          <button id="btn-load-pasted-trip" class="modal-btn action-btn">
            ▶ Load Pasted Data
          </button>
        </div>
      </div>
    </div>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => console.log('PWA ServiceWorker error:', err));
        });
      }
    </script>
  </body>
</html>
